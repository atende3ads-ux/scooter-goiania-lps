---
deployment:
  tasks:
    # Document Root do subdominio lp.scootergoiania.com.br.
    - export DEPLOYPATH=/home2/hg3ads37/lp.scootergoiania.com.br/
    - /bin/mkdir -p $DEPLOYPATH
    # Protege arquivos do servidor (SSL/AutoSSL, cgi-bin, .htaccess) contra o --delete.
    - /usr/bin/rsync -av --delete --exclude='.git' --exclude='.cpanel.yml' --exclude='.DS_Store' --exclude='README.md' --filter='P .well-known/' --filter='P cgi-bin/' --filter='P .htaccess' --filter='P error_log' ./ $DEPLOYPATH
